<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎵 Pokémon Music Unlocker</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-image: url('https://cdn.dribbble.com/userupload/26977107/file/original-dc63fc50d0a658a0b2aec33bcc43d82b.png?resize=752x&vertical=center'); /* Add your image here */
      background-size: cover;  /* Ensure the image covers the whole page */
      background-position: center;  /* Center the background image */
      background-attachment: fixed;  /* Make the background image fixed */
      margin: 0;
      padding: 0;
      text-align: center;
    }

    #logoContainer {
      position: absolute;
      top: 10px;
      left: 20px;
    }

    #logoImage {
      max-width: 2000px;
      height: auto;
      border-radius: 12px;
    }

    h1 {
      margin-top: 40px;
      color: #333;
    }

    #searchContainer {
      margin: 30px auto;
    }

    #searchInput {
      padding: 12px 20px;
      width: 60%;
      max-width: 400px;
      border: 2px solid #888;
      border-radius: 8px;
      font-size: 16px;
    }

    #searchButton {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-left: 10px;
    }

    #searchButton:hover {
      background-color: #ff4d4d;
    }

    #loading {
      display: none;
      margin: 20px;
      font-size: 18px;
      color: #444;
    }

    #results {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      padding: 20px;
    }

    .result-item {
      width: 250px;
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 16px;
      text-align: center;
    }

    .result-item img {
      width: 100%;
      border-radius: 12px;
    }

    .result-item h3 {
      margin: 10px 0 5px;
      font-size: 18px;
      color: #222;
    }

    .result-item p {
      margin: 5px 0;
      color: #555;
    }

    .pokemon-result {
      margin-top: 10px;
      font-weight: bold;
      color: #2d3436;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    #loadMoreButton {
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ff6b6b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    #loadMoreButton:hover {
      background-color: #ff4d4d;
    }
  </style>
</head>
<body>
  <!-- Logo section -->
  <div id="logoContainer">
    <img src="https://media.tenor.com/lNvvMluzI0QAAAAi/charizard-pokemon.gif" alt="Pokémon Music Unlocker Logo" id="logoImage">
  </div>

  <h1>🎶 Unlock Your Pokémon Type with Music</h1>

  <div id="searchContainer">
    <input type="text" id="searchInput" placeholder="Search your favorite song...">
    <button id="searchButton" onclick="searchSongs()">Search</button>
  </div>

  <div id="loading">Loading results...</div>
  <div id="results"></div>
  <button id="loadMoreButton" onclick="loadMoreResults()" style="display:none;">Load More</button>

  <script>
    const clientId = '1e0bfb96b1d546c8a896f0a80a8c09d2';
    const clientSecret = '1d224d6b1b354cbf9dc3992e5cfef77d';
    let accessToken = '';
    let offset = 0;

    const genreToPokemonType = {
      'rock': '🔥 Fire-type',
      'metal': '🔥 Fire-type',
      'lo-fi': '💧 Water-type',
      'jazz': '💧 Water-type',
      'classical': '🌿 Grass-type',
      'instrumental': '🌿 Grass-type',
      'pop': '⚡ Electric-type',
      'dance': '⚡ Electric-type',
      'hip-hop': '❄️ Ice-type',
      'trap': '❄️ Ice-type',
      'blues': '👻 Dark-type',
      'soul': '👻 Dark-type',
      'country': '🪨 Rock-type',
      'acoustic': '🪨 Rock-type',
      'electronic': '🔮 Psychic-type',
      'synth': '🔮 Psychic-type'
    };

    const allPokemonTypes = [
      '🔥 Fire-type',
      '💧 Water-type',
      '🌿 Grass-type',
      '⚡ Electric-type',
      '❄️ Ice-type',
      '👻 Dark-type',
      '🪨 Rock-type',
      '🔮 Psychic-type',
      '🪙 Normal-type'
    ];

    function getPokemonTypeFromGenres(genres) {
      for (const genre of genres) {
        const key = genre.toLowerCase();
        if (genreToPokemonType[key]) {
          return genreToPokemonType[key];
        }
      }
      return allPokemonTypes[Math.floor(Math.random() * allPokemonTypes.length)];
    }

    async function getAccessToken() {
      const result = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'Authorization': 'Basic ' + btoa(clientId + ':' + clientSecret),
        },
        body: 'grant_type=client_credentials',
      });
      const data = await result.json();
      accessToken = data.access_token;
    }

    async function getArtistGenres(artistId) {
      const res = await fetch(`https://api.spotify.com/v1/artists/${artistId}`, {
        headers: {
          'Authorization': 'Bearer ' + accessToken,
        },
      });
      const data = await res.json();
      return data.genres || [];
    }

    async function searchSongs() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      document.getElementById('loading').style.display = 'block';
      const resultsDiv = document.getElementById('results');
      if (offset === 0) resultsDiv.innerHTML = '';

      if (!accessToken) await getAccessToken();

      const response = await fetch(
        `https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=12&offset=${offset}`,
        {
          headers: {
            'Authorization': 'Bearer ' + accessToken,
          },
        }
      );

      const data = await response.json();
      document.getElementById('loading').style.display = 'none';

      if (!data.tracks.items.length) {
        resultsDiv.innerHTML = '<p>No results found</p>';
        return;
      }

      for (let i = 0; i < data.tracks.items.length; i++) {
        const track = data.tracks.items[i];
        const previewUrl = track.preview_url;
        const spotifyUrl = track.external_urls.spotify;
        const imageUrl = track.album.images[0]?.url || '';
        const artistName = track.artists.map(a => a.name).join(', ');
        const artistId = track.artists[0].id;

        const genres = await getArtistGenres(artistId);
        const pokemonType = getPokemonTypeFromGenres(genres);

        const songDiv = document.createElement('div');
        songDiv.className = 'result-item';

        songDiv.innerHTML = `
          <a href="${spotifyUrl}" target="_blank" aria-label="Listen on Spotify">
            <img src="${imageUrl}" alt="${track.name} album cover">
          </a>
          <h3>${track.name}</h3>
          <p>by ${artistName}</p>
        `;

        if (previewUrl) {
          const audio = document.createElement('audio');
          audio.controls = true;
          audio.src = previewUrl;
          songDiv.appendChild(audio);
        } else {
          songDiv.innerHTML += '<p>No preview available</p>';
        }

        const typePara = document.createElement('p');
        typePara.className = 'pokemon-result';
        typePara.textContent = `🎉 You unlocked: ${pokemonType}`;
        songDiv.appendChild(typePara);

        resultsDiv.appendChild(songDiv);
      }

      document.getElementById('loadMoreButton').style.display = data.tracks.items.length === 12 ? 'inline-block' : 'none';
    }

    function loadMoreResults() {
      offset += 12;
      searchSongs();
    }
  </script>
</body>
</html>
